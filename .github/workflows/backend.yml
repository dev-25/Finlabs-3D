name: Deploy backend

# Only when the backend or its config actually changes — there is no reason to
# redeploy a Lambda because someone fixed a typo on the About page.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend.config.json'
      - 'scripts/backend-config.mjs'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  id-token: write # for OIDC — no long-lived AWS keys in GitHub secrets
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false # never cancel a deploy half-applied

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Nobody has filled the config in yet, so there is nothing to deploy.
      # Say so and stop, rather than leaving a red cross on every push.
      - name: Has the backend been set up?
        id: setup
        run: |
          echo "region=$(node -p "require('./backend.config.json').aws.region")" >> "$GITHUB_OUTPUT"
          if node scripts/backend-config.mjs started; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::backend.config.json has no cvBucketName yet, so there is nothing to deploy. See backend/README.md.'
          fi

      - name: Check the config is complete
        if: steps.setup.outputs.ready == 'true'
        run: node scripts/backend-config.mjs check --deploy

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          # Create this role in IAM with a GitHub OIDC trust policy, then put
          # its ARN in repository secrets as AWS_DEPLOY_ROLE_ARN.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ steps.setup.outputs.region }}

      - uses: aws-actions/setup-sam@v2
        if: steps.setup.outputs.ready == 'true'
        with:
          use-installer: true

      - name: Install function dependencies
        if: steps.setup.outputs.ready == 'true'
        working-directory: backend
        run: npm ci --omit=dev

      - name: Build
        if: steps.setup.outputs.ready == 'true'
        working-directory: backend
        run: sam build

      - name: Deploy
        if: steps.setup.outputs.ready == 'true'
        working-directory: backend
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides $(cd .. && node scripts/backend-config.mjs params)
